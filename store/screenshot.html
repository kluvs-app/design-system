<!doctype html>
<!--
  Store screenshot template.
  Usage: screenshot.html?shot=01&size=play   (sizes: play | ios-69 | ios-65)
  The viewport must match the output size exactly — render.sh handles that.
  All dimensions are in vw so one layout serves every size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kluvs store screenshot</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="shots.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    --bg: var(--kluvs-warm-dark-base);
    --fg: #FFFFFF;
    --fg-2: var(--kluvs-warm-fg-tertiary);
    --bezel: var(--kluvs-warm-dark-card-2);
    --screen-empty: var(--kluvs-warm-dark-card);
    background: var(--bg);
    color: var(--fg);
    font-family: var(--kluvs-font-sans);
    -webkit-font-smoothing: antialiased;
  }
  body.light {
    --bg: var(--kluvs-surface-light);
    --fg: var(--kluvs-content-light-primary);
    --fg-2: var(--kluvs-content-light-tertiary);
    --bezel: var(--kluvs-warm-dark-base);
    --screen-empty: var(--kluvs-surface-light-deep);
  }

  /* 6px copper top-edge bleed — the cover-frame motif, scaled to output width */
  .bleed { position: absolute; inset: 0 0 auto 0; height: 0.56vw; background: var(--kluvs-primary); }

  /* --u is a 9:16-normalised unit: equals 1vw on Play (1080×1920) and grows on
     taller canvases (iPhone), so the phone crops at the same point everywhere. */
  .copy { padding: calc(var(--u) * 15) 7vw 0; text-align: center; }
  .eyebrow {
    font-weight: 500; font-size: calc(var(--u) * 2.9); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--kluvs-primary); margin: 0 0 calc(var(--u) * 3.2);
  }
  .headline {
    font-family: var(--kluvs-font-serif); font-weight: 500;
    font-size: calc(var(--u) * 8.2); line-height: 1.08; letter-spacing: -0.01em;
    margin: 0 auto; max-width: 86vw; text-wrap: balance;
  }
  .sub {
    font-size: calc(var(--u) * 3.7); line-height: 1.4; color: var(--fg-2);
    margin: calc(var(--u) * 3.4) auto 0; max-width: 80vw; text-wrap: balance;
  }

  /* Device: plain rounded bezel, no shadow/gradient. Runs off the bottom edge
     so differing aspect ratios (9:16 vs ~19.5:9) just crop more or less. */
  .device {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: calc(var(--u) * 74); padding: calc(var(--u) * 2.2); border-radius: calc(var(--u) * 11);
    background: var(--bezel);
  }
  .screen {
    display: block; width: 100%; border-radius: calc(var(--u) * 8.8); overflow: hidden;
    background: var(--screen-empty); aspect-ratio: 9 / 19.5;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .missing {
    height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8vw; box-sizing: border-box;
    font-size: 3vw; line-height: 1.5; color: var(--fg-2);
  }
</style>
</head>
<body>
  <div class="bleed"></div>
  <div class="copy">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="device" id="device"><div class="screen" id="screen"></div></div>

<script>
  document.documentElement.style.setProperty("--u", (innerHeight * 0.5625 / 100) + "px");
  const q = new URLSearchParams(location.search);
  const shot = KLUVS_SHOTS.find(s => s.id === (q.get("shot") || "01")) || KLUVS_SHOTS[0];
  const size = KLUVS_SIZES[q.get("size") || "play"];

  if ((q.get("surface") || shot.surface || KLUVS_SURFACE) === "light") document.body.classList.add("light");
  document.getElementById("eyebrow").textContent = shot.eyebrow;
  document.getElementById("headline").textContent = shot.headline;
  document.getElementById("sub").textContent = shot.sub;

  // Place the device just under the copy block.
  const place = () => {
    const copy = document.querySelector(".copy").getBoundingClientRect();
    document.getElementById("device").style.top = (copy.bottom + innerHeight * 0.5625 * 0.08) + "px";
  };

  const src = size.raw(shot.id);
  const screen = document.getElementById("screen");
  const img = new Image();
  img.onload = () => {
    screen.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
    screen.appendChild(img);
    document.body.dataset.ready = "1";
  };
  img.onerror = () => {
    screen.innerHTML = `<div class="missing">Add capture<br>store/${src}</div>`;
    document.body.dataset.ready = "1";
  };
  img.alt = shot.headline;
  img.src = src;

  document.fonts.ready.then(place);
  addEventListener("resize", place);
</script>
</body>
</html>
