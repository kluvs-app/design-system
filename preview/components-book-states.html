<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.label { font: 500 12px/1 var(--kluvs-font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .label { color: var(--kluvs-content-light-secondary); }

.card { background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 12px; padding: 24px; box-sizing: border-box; display: flex; gap: 24px; flex-wrap: wrap; }
[data-surface="light"] .card { background: #FFFFFF; border-color: var(--kluvs-divider-light); box-shadow: var(--kluvs-shadow-card); }

.item-label { font: 500 10px/1 var(--kluvs-font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--kluvs-warm-fg-placeholder); margin-bottom: 14px; }
[data-surface="light"] .item-label { color: var(--kluvs-content-light-secondary); }

.cover-box { width: 80px; height: 120px; border-radius: 4px; background: var(--kluvs-warm-dark-bar); border: 1px solid var(--kluvs-warm-dark-card-2); position: relative; }
[data-surface="light"] .cover-box { background: #F5F5F5; border-color: #E0E0E0; }

.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; padding: 24px 16px; width: 100%; }

.t-heading { font-size: 22px; color: var(--kluvs-warm-fg-primary); }
[data-surface="light"] .t-heading { color: #1A1A1A; }
.t-body { margin-top: 8px; color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .t-body { color: #666666; }
</style></head>
<body><div class="canvas">

  <div class="group">
    <span class="label">Book States</span>
    <div class="card">
      <div>
        <div class="item-label">Read Indicators</div>
        <div style="display:flex;gap:24px;align-items:flex-end">
          <div class="cover-box">
            <span class="kluvs-read-ribbon kluvs-read-ribbon--full" title="Read" aria-label="Read"></span>
          </div>
          <span class="kluvs-read-badge" title="Read" aria-label="Read">
            <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M264.65-107 48.74-480l215.91-373h430.7l215.91 373-215.91 373h-430.7Z"/></svg>
          </span>
        </div>
      </div>
      <div>
        <div class="item-label">No-Cover Fallback</div>
        <div class="kluvs-cover-placeholder" style="width:80px;height:120px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px">
          <span class="kluvs-cover-placeholder__label">No cover</span>
        </div>
      </div>
      <div style="width:100%">
        <div class="item-label">Empty Shelf</div>
        <div class="empty-state">
          <div class="kluvs-empty-covers" style="width:160px;height:140px">
            <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(-33px,3px) rotate(-7deg)"></div>
            <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(0,-3px) rotate(4deg)"></div>
            <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(33px,3px) rotate(10deg)"></div>
          </div>
          <div>
            <p class="kluvs-empty-heading t-heading">Nothing shelved yet.</p>
            <p class="kluvs-empty-body t-body">Search for a book and add it to Want to Read, Read, or Not Finished — it'll show up here.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</div></body></html>
