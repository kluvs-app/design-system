<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.card { background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 12px; padding: 20px; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
[data-surface="light"] .card { background: var(--kluvs-surface-light-raised); border-color: var(--kluvs-divider-light); box-shadow: var(--kluvs-shadow-card); }

.state-box { background: var(--kluvs-warm-dark-base); border-radius: 12px; padding: 16px; border: 1px solid var(--kluvs-warm-dark-card-2); }
[data-surface="light"] .state-box { background: var(--kluvs-surface-light); border-color: var(--kluvs-divider-light); }

/* In states like progress and timeline, the box is often on top of the card base, so it uses dark-base or white */
.progress-box, .timeline-box { background: var(--kluvs-warm-dark-base); border-radius: 12px; padding: 16px; border: 1px solid var(--kluvs-warm-dark-card-2); }
[data-surface="light"] .progress-box, [data-surface="light"] .timeline-box { background: var(--kluvs-surface-light-raised); border: 1px solid var(--kluvs-divider-light); }

.t-main { color: var(--kluvs-warm-fg-primary); }
[data-surface="light"] .t-main { color: #1A1A1A; }
.t-sub { color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .t-sub { color: #666666; }
.t-muted { color: var(--kluvs-warm-fg-placeholder); }
[data-surface="light"] .t-muted { color: #B0B0B0; }
</style></head>
<body><div class="canvas">

    <div class="card">
      <div class="state-box" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:120px">
        <img class="kluvs-spinner" src="../assets/spinner-kluvs.svg" alt="Loading" width="36" height="36">
        <span class="t-muted" style="font-size:13px">Loading…</span>
      </div>
      <div class="state-box" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:120px;text-align:center">
        <div style="width:32px;height:32px;border-radius:50%;border:2px solid var(--kluvs-danger);display:flex;align-items:center;justify-content:center"><span style="color:var(--kluvs-danger);font-weight:700;font-size:14px">!</span></div>
        <div class="t-main" style="font-weight:600;font-size:14px">Something went wrong</div>
        <div class="t-sub" style="font-size:12px">Please try again</div>
        <button style="background:var(--kluvs-primary);color:#fff;border:none;border-radius:8px;padding:8px 16px;font:500 12px/1 var(--kluvs-font-sans);cursor:default;margin-top:4px">Try again</button>
      </div>
      <div class="state-box" style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:24px 16px">
        <div class="kluvs-empty-covers" style="width:160px;height:140px">
          <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(-33px,3px) rotate(-7deg)"></div>
          <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(0,-3px) rotate(4deg)"></div>
          <div class="kluvs-empty-covers__cover" style="width:80px;height:114px;transform:translate(33px,3px) rotate(10deg)"></div>
        </div>
        <div>
          <p class="kluvs-empty-heading t-main" style="margin:0">Nothing shelved yet.</p>
          <p class="kluvs-empty-body t-sub" style="margin-top:8px;margin-bottom:0">Search for a book and add it to Want to Read, Read, or Not Finished — it'll show up here.</p>
        </div>
      </div>
      <div class="progress-box">
        <div class="t-sub" style="font:500 10px/1 var(--kluvs-font-sans);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px">Reading Progress</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="kluvs-progress-track" style="flex:1"><div class="kluvs-progress-fill" style="width:47%"></div></div>
          <button class="kluvs-btn-secondary kluvs-btn-secondary--sm">Update</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:flex-end;margin-top:8px">
          <span style="font:500 12px/1 var(--kluvs-font-sans);color:var(--kluvs-primary);letter-spacing:0.04em">203 of 432 pages</span>
        </div>
      </div>
      <div class="timeline-box">
        <div class="t-sub" style="font:500 10px/1 var(--kluvs-font-sans);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px">Discussion Timeline</div>
        <div style="display:flex;flex-direction:column">
          <div style="display:flex;gap:12px;align-items:flex-start"><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0"><div style="width:12px;height:12px;border-radius:50%;background:var(--kluvs-primary);margin-top:2px"></div><div style="width:1px;flex:1;background:var(--kluvs-warm-dark-card-2);min-height:28px"></div></div><div style="padding-bottom:16px"><div class="t-main" style="font-weight:600;font-size:13px">Chapters 1–8</div><div class="t-sub" style="font-size:11px;margin-top:4px">Mar 2, 2026 · Active</div></div></div>
          <div style="display:flex;gap:12px;align-items:flex-start"><div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0"><div style="width:12px;height:12px;border-radius:50%;background:var(--kluvs-warm-dark-card-2);border:2px solid var(--kluvs-warm-fg-placeholder);margin-top:2px"></div><div style="width:1px;flex:1;background:var(--kluvs-warm-dark-card-2);min-height:28px"></div></div><div style="padding-bottom:16px"><div class="t-muted" style="font-weight:600;font-size:13px">Chapters 9–16</div><div class="t-muted" style="font-size:11px;margin-top:4px">Apr 6, 2026 · Upcoming</div></div></div>
        </div>
      </div>
    </div>

</div></body></html>
