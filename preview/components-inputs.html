<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.card { background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 12px; padding: 20px; width: 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
[data-surface="light"] .card { background: var(--kluvs-surface-light-raised); border-color: var(--kluvs-divider-light); box-shadow: var(--kluvs-shadow-card); }

.input-wrap { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.input-label { font: 500 12px/1 var(--kluvs-font-sans); color: var(--kluvs-warm-fg-primary); }
[data-surface="light"] .input-label { color: var(--kluvs-warm-dark-base); }

.input-field { width: 100%; padding: 11px 14px; border-radius: 8px; font: 400 14px/1 var(--kluvs-font-sans); outline: none; box-sizing: border-box; }

/* Dark (Default) */
.input-field { background: var(--kluvs-warm-dark-card); color: var(--kluvs-warm-fg-primary); border: 1px solid var(--kluvs-warm-dark-card-2); }
.input-field--focus { border: 2px solid var(--kluvs-primary); }
.input-field--error { border: 1px solid var(--kluvs-danger); }
.input-field--disabled { background: var(--kluvs-warm-dark-base); color: var(--kluvs-warm-fg-disabled); border: 1px solid var(--kluvs-warm-dark-card); cursor: not-allowed; }

/* Light overrides */
[data-surface="light"] .input-field { background: var(--kluvs-surface-light-raised); color: var(--kluvs-content-light-primary); border: 1px solid #b0b0b0; }
[data-surface="light"] .input-field--focus { border: 2px solid var(--kluvs-primary); }
[data-surface="light"] .input-field--error { border: 1px solid var(--kluvs-danger); }
[data-surface="light"] .input-field--disabled { background: var(--kluvs-surface-light); color: var(--kluvs-content-light-disabled); border: 1px solid var(--kluvs-surface-light-raised); }

.input-adorned { position: relative; display: flex; align-items: center; }
.input-adorn { position: absolute; left: 14px; font: 400 14px/1 var(--kluvs-font-sans); color: var(--kluvs-warm-fg-tertiary); pointer-events: none; }
[data-surface="light"] .input-adorn { color: var(--kluvs-content-light-secondary); }
.input-adorned .input-field { padding-left: 26px; }

.error-msg { font: 400 12px/1 var(--kluvs-font-sans); color: var(--kluvs-danger); margin-top: -2px; }
.helper-msg { font: 400 12px/1 var(--kluvs-font-sans); color: var(--kluvs-warm-fg-tertiary); margin-top: -2px; }
[data-surface="light"] .helper-msg { color: var(--kluvs-content-light-secondary); }

/* PickerField: same border/label/radius as input-field, but no raised background —
   blends into the surrounding card instead, signaling "tap, don't type". */
.picker-field { background: transparent; }
[data-surface="light"] .picker-field { background: transparent; }

/* SearchField: no label, leading icon, trailing clear button. */
.search-field { position: relative; display: flex; align-items: center; }
.search-field .input-field { padding-left: 38px; padding-right: 34px; }
.search-icon { position: absolute; left: 12px; color: var(--kluvs-warm-fg-tertiary); pointer-events: none; }
[data-surface="light"] .search-icon { color: var(--kluvs-content-light-secondary); }
.search-clear { position: absolute; right: 10px; width: 20px; height: 20px; border-radius: 999px; border: none; background: transparent; color: var(--kluvs-warm-fg-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; }
[data-surface="light"] .search-clear { color: var(--kluvs-content-light-secondary); }
</style></head>
<body><div class="canvas">

    <div class="card">
      <div class="input-wrap">
        <div class="input-label">Email</div>
        <input class="input-field" type="text" value="name@example.com" readonly>
      </div>
      <div class="input-wrap">
        <div class="input-label" style="color:var(--kluvs-primary)">Password</div>
        <input class="input-field input-field--focus" type="text" value="••••••••" readonly>
      </div>
      <div class="input-wrap">
        <div class="input-label" style="color:var(--kluvs-danger)">Email</div>
        <input class="input-field input-field--error" type="text" placeholder="name@example.com" readonly>
        <div class="error-msg">Error: this field is required</div>
      </div>
      <div class="input-wrap">
        <div class="input-label" style="opacity:0.5">Email</div>
        <input class="input-field input-field--disabled" type="text" value="user@kluvs.com" disabled>
      </div>
      <div class="input-wrap">
        <div class="input-label">Page</div>
        <div class="input-adorned">
          <span class="input-adorn">#</span>
          <input class="input-field" type="text" value="42" readonly>
        </div>
      </div>
      <div class="input-wrap">
        <div class="input-label">Note</div>
        <textarea class="input-field" rows="3" placeholder="Add a note…" readonly></textarea>
        <div class="helper-msg">Only visible to you.</div>
      </div>
    </div>

    <div class="card">
      <div class="input-wrap">
        <div class="input-label">Date</div>
        <input class="input-field picker-field" type="text" value="Jan 15, 2026" readonly>
      </div>
      <div class="input-wrap">
        <div class="input-label" style="opacity:0.5">Date</div>
        <input class="input-field picker-field" type="text" value="Jan 15, 2026" readonly disabled style="cursor:not-allowed">
      </div>
    </div>

    <div class="card">
      <div class="input-wrap">
        <div class="search-field">
          <span class="search-icon">&#128269;</span>
          <input class="input-field" type="text" placeholder="Search books" readonly>
        </div>
      </div>
      <div class="input-wrap">
        <div class="search-field">
          <span class="search-icon">&#128269;</span>
          <input class="input-field" type="text" value="One Hundred Years" readonly>
          <button class="search-clear">&#10005;</button>
        </div>
      </div>
    </div>

</div></body></html>
