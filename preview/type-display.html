<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;background:#fff;font-family:var(--kluvs-font-sans);}
.card{width:700px;padding:24px;display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:baseline;gap:24px;}
.spec{font-family:ui-monospace,monospace;font-size:11px;color:#8C8C8C;min-width:150px;}
.sample{color:#1A1A1A;}
</style></head>
<body><div class="card">
  <div class="row"><span class="sample kluvs-display-s kluvs-feature">Display S</span><span class="spec">serif 700 · 48 / 52 · hero, masthead</span></div>
  <div class="row"><span class="sample kluvs-headline-l">Headline L</span><span class="spec">serif 500 · 40 / 46</span></div>
  <div class="row"><span class="sample kluvs-headline-m">Headline M</span><span class="spec">serif 500 · 34 / 40</span></div>
  <div class="row"><span class="sample kluvs-headline-s">Headline S</span><span class="spec">serif 500 · 30 / 36</span></div>
  <div class="row"><span class="sample kluvs-title-l kluvs-feature">Title L + feature</span><span class="spec">serif 500 · 24 / 30</span></div>
  <div class="row"><span class="sample kluvs-title-m">Title M</span><span class="spec">serif 500 · 19 / 24</span></div>
  <div class="row"><span class="sample kluvs-title-s">Title S</span><span class="spec">serif 500 · 15 / 20</span></div>
</div></body></html>
