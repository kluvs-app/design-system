<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="../colors_and_type.css" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: transparent;
                font-family: var(--kluvs-font-sans);
                -webkit-font-smoothing: antialiased;
            }
            .canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
            .card { background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 12px; padding: 24px; box-sizing: border-box; display: flex; gap: 24px; flex-wrap: wrap; }
            [data-surface="light"] .card {
                background: var(--kluvs-surface-light-raised);
                border-color: var(--kluvs-divider-light);
                box-shadow: var(--kluvs-shadow-card);
            }

            .item-label {
                font: 500 10px/1 var(--kluvs-font-sans);
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--kluvs-warm-fg-placeholder);
                margin-bottom: 14px;
            }
            [data-surface="light"] .item-label {
                color: var(--kluvs-content-light-secondary);
            }
        </style>
    </head>
    <body>
        <div class="canvas">
                <div class="card">
                    <div>
                        <div class="item-label">Kluvs Reading Indicators</div>
                        <div
                            style="
                                display: flex;
                                gap: 24px;
                                align-items: flex-end;
                            "
                        >
                            <div class="kluvs-book-cover kluvs-book-cover--md">
                                <span
                                    class="kluvs-read-ribbon kluvs-read-ribbon--md"
                                    title="Read"
                                    aria-label="Read"
                                ></span>
                            </div>
                            <span
                                class="kluvs-read-badge"
                                title="Read"
                                aria-label="Read"
                            >
                                <svg
                                    viewBox="0 -960 960 960"
                                    fill="currentColor"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M264.65-107 48.74-480l215.91-373h430.7l215.91 373-215.91 373h-430.7Z"
                                    />
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div>
                        <div class="item-label">No-Cover Fallback</div>
                        <div class="kluvs-book-cover kluvs-book-cover--md kluvs-cover-placeholder">
                            <svg class="kluvs-cover-placeholder__grid" width="100%" height="100%" style="position:absolute; inset:0;">
                                <defs>
                                    <pattern id="honeycomb" width="28" height="48.4974" patternUnits="userSpaceOnUse" viewBox="0 0 28 48.4974">
                                        <path d="M14 0 l14 8.0829 v16.1645 l-14 8.0829 l-14 -8.0829 v-16.1645 z M0 24.2487 l14 8.0829 v16.1645 l-14 8.0829 l-14 -8.0829 v-16.1645 z M28 24.2487 l14 8.0829 v16.1645 l-14 8.0829 l-14 -8.0829 v-16.1645 z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
                                    </pattern>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#honeycomb)" />
                            </svg>
                            <span class="kluvs-cover-placeholder__label" style="position:absolute; bottom:6px;">No cover</span>
                        </div>
                    </div>
                </div>
        </div>
    </body>
</html>
