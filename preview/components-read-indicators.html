<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 32px; align-items: flex-start; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; width: 320px; }
.label { font: 500 12px/1 var(--kluvs-font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .label { color: var(--kluvs-content-light-secondary); }

.cover { width: 100px; height: 150px; border-radius: 8px; background: var(--kluvs-warm-dark-bar); border: 1px solid var(--kluvs-warm-dark-card-2); }
[data-surface="light"] .cover { background: #F5F5F5; border-color: #E0E0E0; }

.cover-sm { width: 64px; height: 96px; }
.relative { position: relative; }

.row { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 8px; }
[data-surface="light"] .row { background: #FFFFFF; border-color: #E0E0E0; box-shadow: var(--kluvs-shadow-card); }

.row-text { color: var(--kluvs-warm-fg-primary); font-size: 14px; }
[data-surface="light"] .row-text { color: #1A1A1A; }
</style></head>
<body><div class="canvas">

  <div class="group">
    <div class="relative">
      <div class="cover"></div>
      <span class="kluvs-read-ribbon kluvs-read-ribbon--full" title="Read" aria-label="Read"></span>
    </div>
    <span class="label">Ribbon — full</span>
  </div>

  <div class="group">
    <div class="relative">
      <div class="cover cover-sm"></div>
      <span class="kluvs-read-ribbon kluvs-read-ribbon--compact" title="Read" aria-label="Read"></span>
    </div>
    <span class="label">Ribbon — compact</span>
  </div>

  <div class="group">
    <div class="row">
      <span class="kluvs-read-badge" title="Read" aria-label="Read">
        <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path d="M264.65-107 48.74-480l215.91-373h430.7l215.91 373-215.91 373h-430.7Z" />
        </svg>
      </span>
      <span class="row-text">Cien Años de Soledad</span>
    </div>
    <span class="label">Badge — list row</span>
  </div>

</div></body></html>
