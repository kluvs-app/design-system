<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.card-spec { border-radius: 12px; padding: 16px; width: 340px; box-sizing: border-box; }
.card-spec--default { background: var(--kluvs-warm-dark-card); }
[data-surface="light"] .card-spec--default { background: var(--kluvs-surface-light-raised); border: 1px solid var(--kluvs-divider-light); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

.card-spec--accent { background: var(--kluvs-warm-dark-accent); border: 1.5px solid var(--kluvs-primary); }
[data-surface="light"] .card-spec--accent { background: rgba(209,109,48,0.04); border: 1.5px solid var(--kluvs-primary); }

.card-eyebrow { font: 600 10px/1 var(--kluvs-font-sans); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
.card-title { font: 700 16px/1.3 var(--kluvs-font-sans); margin-bottom: 4px; }
.card-subtitle { font: 400 13px/1 var(--kluvs-font-sans); }
.card-meta { font: 400 12px/1 var(--kluvs-font-sans); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--kluvs-warm-dark-card-2); }
[data-surface="light"] .card-meta { border-top-color: #E0E0E0; }

/* Reactive colors */
.t-main { color: var(--kluvs-warm-fg-primary); }
[data-surface="light"] .t-main { color: #1A1A1A; }
.t-label { color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .t-label { color: #999999; }
.t-meta { color: var(--kluvs-warm-fg-placeholder); }
[data-surface="light"] .t-meta { color: #B0B0B0; }
.t-sub { color: var(--kluvs-warm-fg-primary); }
[data-surface="light"] .t-sub { color: var(--kluvs-warm-dark-base); }

.loc-ico { width: 14px; height: 14px; filter: brightness(0) invert(1); opacity: 0.4; }
[data-surface="light"] .loc-ico { filter: none; }
</style></head>
<body><div class="canvas">

    <div class="card-spec card-spec--default">
      <div class="card-eyebrow t-label">Currently Reading</div>
      <div class="card-title t-main">The Midnight Library</div>
      <div class="card-subtitle t-sub">Matt Haig · 288 pages</div>
      <div class="card-meta t-meta">6 members · Active session</div>
    </div>
    <div class="card-spec card-spec--accent">
      <div class="card-eyebrow" style="color:var(--kluvs-primary)">Next Discussion</div>
      <div class="card-title t-main">March 2, 2026 at 5:00 PM</div>
      <div class="card-subtitle t-sub">In person · Café Literario</div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <img src="../assets/icon-location.svg" class="loc-ico" alt="">
        <span class="card-subtitle t-label" style="font-size:12px">6 members attending</span>
      </div>
    </div>

</div></body></html>
