<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
html, body { margin: 0; padding: 0; background: transparent; font-family: var(--kluvs-font-sans); -webkit-font-smoothing: antialiased; }
.canvas { display: flex; gap: 32px; padding: 24px; align-items: flex-start; flex-wrap: wrap; }
.group { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.label { font: 500 12px/1 var(--kluvs-font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--kluvs-warm-fg-tertiary); }
[data-surface="light"] .label { color: var(--kluvs-content-light-secondary); }

.card { background: var(--kluvs-warm-dark-card); border: 1px solid var(--kluvs-warm-dark-card-2); border-radius: 12px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; }
[data-surface="light"] .card { background: #FFFFFF; border-color: var(--kluvs-divider-light); box-shadow: var(--kluvs-shadow-card); }

.size-label { font: 600 10px/1 var(--kluvs-font-sans); color: var(--kluvs-warm-fg-placeholder); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
[data-surface="light"] .size-label { color: var(--kluvs-content-light-secondary); }

.hue-grid { display: flex; gap: 6px; flex-wrap: wrap; max-width: 140px; }
.hue-dot { width: 18px; height: 18px; border-radius: 50%; }

.divider { height: 1px; background: var(--kluvs-warm-dark-card-2); width: 100%; }
[data-surface="light"] .divider { background: var(--kluvs-divider-light); }
</style></head>
<body><div class="canvas">

  <div class="group">
    <span class="label">Avatar Variations</span>
    <div class="card">
      <div style="display:flex;gap:32px;align-items:flex-end">
        <div><div class="size-label">sm · 20px</div><div class="kluvs-avatar" style="width:20px;height:20px;font-size:8px;background:#5865F2">JD</div></div>
        <div><div class="size-label">md · 24px</div><div class="kluvs-avatar" style="width:24px;height:24px;font-size:10px;background:#5BAA5C">KM</div></div>
        <div><div class="size-label">lg · 40px</div><div class="kluvs-avatar" style="width:40px;height:40px;font-size:12px;background:#9B59B6">RP</div></div>
        <div><div class="size-label">xl · 88px</div><div class="kluvs-avatar" style="width:88px;height:88px;font-size:35px;background:var(--kluvs-primary)">Me</div></div>
      </div>
      <div class="divider"></div>
      <div style="display:flex;gap:24px;align-items:center">
        <div>
          <div class="size-label" style="text-align:left">Hue palette</div>
          <div class="hue-grid">
            <div class="hue-dot" style="background:#5865F2"></div>
            <div class="hue-dot" style="background:#5BAA5C"></div>
            <div class="hue-dot" style="background:#9B59B6"></div>
            <div class="hue-dot" style="background:#0097A7"></div>
            <div class="hue-dot" style="background:#3498DB"></div>
            <div class="hue-dot" style="background:#E74C3C"></div>
            <div class="hue-dot" style="background:#16A085"></div>
            <div class="hue-dot" style="background:#5C6BC0"></div>
            <div class="hue-dot" style="background:#8E44AD"></div>
            <div class="hue-dot" style="background:#2ECC71"></div>
            <div class="hue-dot" style="background:var(--kluvs-primary)" title="own user"></div>
          </div>
        </div>
        <div style="flex:1">
          <div class="size-label">Avatar Stack</div>
          <div class="kluvs-avatar-stack">
            <div class="kluvs-avatar" style="width:24px;height:24px;font-size:10px;background:#5865F2">LM</div>
            <div class="kluvs-avatar" style="width:24px;height:24px;font-size:10px;background:#5BAA5C">AP</div>
            <div class="kluvs-avatar" style="width:24px;height:24px;font-size:10px;background:var(--kluvs-primary)">DU</div>
            <div class="kluvs-avatar-stack__overflow">+2</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div></body></html>
